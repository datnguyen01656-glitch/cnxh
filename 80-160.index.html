      { id: 113, q: "Câu 113. Về phương diện kinh tế, mục tiêu hàng đầu của nhà nước xã hội chủ nghĩa là", opts: ["A. chăm lo cho lợi ích của giai cấp nông dân.", "B. chăm lo cho lợi ích của giai cấp tư sản.", "C. chăm lo cho lợi ích của đại đa số nhân dân lao động.", "D. chăm lo cho lợi ích của tầng lớp trí thức."], ans: 2 },
      { id: 114, q: "Câu 114. Theo chủ nghĩa xã hội khoa học, về phương diện văn hóa, xã hội, nhà nước xã hội chủ nghĩa được xây dựng trên nền tảng tinh thần", opts: ["A. lý luận của chủ nghĩa Mác - Lênin.", "B. những giá trị văn hóa tiên tiến của nhân loại.", "C. những bản sắc riêng của dân tộc.", "D. Bao gồm tất cả các đáp án."], ans: 3 },
      { id: 115, q: "Câu 115. Theo chủ nghĩa xã hội khoa học, căn cứ vào tính chất của quyền lực nhà nước, chức năng của nhà nước xã hội chủ nghĩa được chia thành", opts: ["A. chức năng đối nội và chức năng đối ngoại.", "B. chức năng đối nội và chức năng chính trị.", "C. chức năng giai cấp và chức năng xã hội.", "D. chức năng kinh tế và chức năng chính trị."], ans: 2 },
      { id: 116, q: "Câu 116. Theo chủ nghĩa xã hội khoa học, căn cứ vào phạm vi tác động của quyền lực nhà nước, chức năng của nhà nước xã hội chủ nghĩa được chia thành", opts: ["A. chức năng giai cấp và chức năng xã hội.", "B. chức năng đối nội và chức năng chính trị.", "C. chức năng kinh tế và chức năng chính trị.", "D. chức năng đối nội và chức năng đối ngoại."], ans: 3 },
      { id: 117, q: "Câu 117. Theo chủ nghĩa xã hội khoa học, căn cứ vào lĩnh vực tác động của quyền lực nhà nước, chức năng của nhà nước xã hội chủ nghĩa được chia thành", opts: ["A. chức năng giai cấp và chức năng xã hội.", "B. chức năng đối nội và chức năng chính trị.", "C. chức năng đối nội và chức năng đối ngoại.", "D. chức năng chính trị, kinh tế, văn hóa, xã hội."], ans: 3 },
      { id: 118, q: "Câu 118. Theo chủ nghĩa xã hội khoa học, một trong những nội dung thể hiện mối quan hệ giữa dân chủ xã hội chủ nghĩa và nhà nước xã hội chủ nghĩa là gì?", opts: ["A. Dân chủ xã hội chủ nghĩa là cơ sở, nền móng cho việc xây dựng và hoạt động của nhà nước.", "B. Dân chủ là công cụ, nền móng cho việc xây dựng và hoạt động của nhà nước xã hội chủ nghĩa.", "C. Dân chủ xã hội chủ nghĩa là công cụ, phương tiện cho việc hoạt động của nhà nước xã hội chủ nghĩa.", "D. Dân chủ xã hội chủ nghĩa là cơ sở, nền tảng cho việc xây dựng và hoạt động của nhà nước xã hội chủ nghĩa."], ans: 3 },
      { id: 119, q: "Câu 119. Theo chủ nghĩa xã hội khoa học, một trong những nội dung thể hiện mối quan hệ giữa dân chủ xã hội chủ nghĩa và nhà nước xã hội chủ nghĩa là gì?", opts: ["A. Nhà nước xã hội chủ nghĩa trở thành công cụ quan trọng cho việc thực thi quyền làm chủ của người dân.", "B. Nhà nước xã hội chủ nghĩa trở thành nền tảng quan trọng cho việc thực thi quyền làm chủ của giai cấp công nhân.", "C. Nhà nước xã hội chủ nghĩa trở thành cơ sở quan trọng cho việc thực thi quyền làm chủ của giai cấp nông dân.", "D. Tất cả các đáp án trên đều sai."], ans: 0 },
      { id: 120, q: "Câu 120. Điền vào chỗ trống để hoàn thành quan điểm của Đảng Cộng sản Việt Nam: \"Lấy..., xây dựng và phát huy quyền làm chủ của nhân dân lao động\".", opts: ["A. nông dân làm gốc.", "B. trí thức làm gốc.", "C. vô sản làm gốc.", "D. dân làm gốc."], ans: 3 },
      { id: 121, q: "Câu 121. Ở Việt Nam, hình thức dân chủ gián tiếp là", opts: ["A. hình thức dân chủ đại diện, được thực hiện do nhân dân \"ủy quyền\", giao quyền lực của mình cho tổ chức mà nhân dân trực tiếp bầu ra.", "B. hình thức thông qua đó, nhân dân bằng hành động trực tiếp của mình thực hiện quyền làm chủ nhà nước và xã hội.", "C. hình thức dân chủ gián tiếp, được thực hiện do nhân dân \"ủy quyền\", giao quyền lực của mình cho tổ chức mà nhân dân gián tiếp bầu ra.", "D. Tất cả các đáp án trên đều đúng."], ans: 0 },
      { id: 122, q: "Câu 122. Ở Việt Nam, hình thức dân chủ nào được thực hiện do nhân dân \"ủy quyền\", giao quyền lực của mình cho tổ chức mà nhân dân trực tiếp bầu ra?", opts: ["A. Dân chủ trực tiếp.", "B. Dân chủ gián tiếp.", "C. Dân chủ bán gián tiếp.", "D. Dân chủ bán trực tiếp."], ans: 1 },
      { id: 123, q: "Câu 123. Ở Việt Nam, hình thức dân chủ nào mà thông qua đó, nhân dân bằng hành động trực tiếp của mình thực hiện quyền làm chủ nhà nước và xã hội?", opts: ["A. Dân chủ gián tiếp.", "B. Dân chủ bán gián tiếp.", "C. Dân chủ trực tiếp.", "D. Dân chủ bán trực tiếp."], ans: 2 },
      { id: 124, q: "Câu 124. Theo quan niệm chung, nhà nước pháp quyền là", opts: ["A. nhà nước độc tài chuyên chế.", "B. nhà nước tôn giáo.", "C. nhà nước tước đoạt tự do của người dân.", "D. nhà nước thượng tôn pháp luật."], ans: 3 },
      { id: 125, q: "Câu 125. Quan điểm về quyền lực nhà nước được Đảng ta nhấn mạnh trong Đại hội XIII là gì?", opts: ["A. Quyền lực nhà nước là thống nhất.", "B. Có sự phân công rành mạch, phối hợp chặt chẽ.", "C. Tăng cường kiểm soát quyền lực nhà nước.", "D. Bao gồm tất cả các đáp án trên."], ans: 3 },
      { id: 126, q: "Câu 126. Một trong những đặc điểm của Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam là", opts: ["A. nhà nước được tổ chức và hoạt động dựa trên nguyện vọng của giai cấp tư sản.", "B. nhà nước được tổ chức và hoạt động dựa trên cơ sở của Hiến pháp và pháp luật.", "C. nhà nước được tổ chức và hoạt động dựa trên nguyện vọng của giai cấp nông dân.", "D. nhà nước được tổ chức và hoạt động dựa trên cơ sở tư tưởng của tầng lớp trí thức."], ans: 1 },
      { id: 127, q: "Câu 127. Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam do cơ quan nào lãnh đạo?", opts: ["A. Quốc hội.", "B. Mặt trận Tổ quốc Việt Nam.", "C. Đảng Cộng sản Việt Nam.", "D. Chính phủ."], ans: 2 },
      { id: 128, q: "Câu 128. Hoạt động của Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam được giám sát bởi Nhân dân với phương châm", opts: ["A. nhà nước phục vụ công nhân, gắn bó mật thiết với công nhân.", "B. \"Dân biết, dân bàn, dân kiểm tra\" không thông qua các tổ chức.", "C. nhà nước phục vụ nông dân, gắn bó mật thiết với nông dân.", "D. \"Dân biết, dân bàn, dân làm, dân kiểm tra\" thông qua các tổ chức, các cá nhân được nhân dân ủy nhiệm."], ans: 3 },
      { id: 129, q: "Câu 129. Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam mang bản chất của giai cấp nào?", opts: ["A. Giai cấp công nhân.", "B. Giai cấp nông dân.", "C. Nhân dân lao động.", "D. Tầng lớp trí thức."], ans: 0 },
      { id: 130, q: "Câu 130. Điều kiện tiên quyết để xây dựng nền dân chủ xã hội chủ nghĩa Việt Nam là", opts: ["A. xây dựng Nhà nước pháp quyền xã hội chủ nghĩa vững mạnh.", "B. xây dựng Đảng Cộng sản Việt Nam trong sạch, vững mạnh.", "C. nâng cao vai trò của các tổ chức chính trị - xã hội.", "D. hoàn thiện các hệ thống giám sát, phản biện xã hội."], ans: 1 },
      { id: 131, q: "Câu 131. Điền vào chỗ trống để hoàn thiện định nghĩa sau: \"Cơ cấu xã hội là những cộng đồng người cùng toàn bộ những... do sự tác động lẫn nhau của các cộng đồng ấy tạo nên\".", opts: ["A. mối liên hệ.", "B. mối quan hệ cá nhân.", "C. mối quan hệ xã hội.", "D. mối quan hệ tự nhiên."], ans: 2 },
      { id: 132, q: "Câu 132. Môn Chủ nghĩa xã hội khoa học tập trung nghiên cứu cơ cấu xã hội - giai cấp vì", opts: ["A. đó là một trong những cơ sở để nghiên cứu vấn đề liên minh giai cấp, tầng lớp.", "B. đó là cơ sở để giai cấp tư sản thống trị các giai cấp còn lại.", "C. đó là cơ sở để giai cấp nông dân tiến hành đấu tranh lật đổ giai cấp tư sản.", "D. Bao gồm tất cả các đáp án trên."], ans: 0 },
      { id: 133, q: "Câu 133. Khái niệm nào dùng để chỉ hệ thống các giai cấp, tầng lớp xã hội tồn tại khách quan trong một chế độ xã hội nhất định?", opts: ["A. Cơ cấu xã hội - giai cấp.", "B. Cơ cấu xã hội - dân cư.", "C. Cơ cấu xã hội - dân tộc.", "D. Cơ cấu xã hội - tôn giáo."], ans: 0 },
      { id: 134, q: "Câu 134. Mối quan hệ nào đóng vai trò quyết định đến sự hình thành cơ cấu xã hội - giai cấp?", opts: ["A. Mối quan hệ về tổ chức quản lý quá trình sản xuất.", "B. Mối quan hệ về sở hữu tư liệu sản xuất.", "C. Mối quan hệ về địa vị chính trị - xã hội.", "D. Mối quan hệ về phân phối."], ans: 1 },
      { id: 135, q: "Câu 135. Trong cơ cấu xã hội - giai cấp của thời kỳ quá độ lên chủ nghĩa xã hội bao gồm những giai cấp, tầng lớp nào?", opts: ["A. Giai cấp công nhân, giai cấp nông dân, tầng lớp trí thức.", "B. Tầng lớp doanh nhân, tầng lớp tiểu chủ.", "C. Tầng lớp thanh niên, phụ nữ.", "D. Bao gồm tất cả các đáp án trên."], ans: 3 },
      { id: 136, q: "Câu 136. Cơ cấu xã hội - giai cấp trong thời kỳ quá độ lên chủ nghĩa xã hội đặt dưới sự lãnh đạo của tổ chức nào?", opts: ["A. Đảng dân chủ.", "B. Đoàn thanh niên.", "C. Đội tiền phong của giai cấp nông dân.", "D. Đảng Cộng sản."], ans: 3 },
      { id: 137, q: "Câu 137. Vì sao cơ cấu xã hội - giai cấp có vị trí quan trọng hàng đầu trong cơ cấu xã hội?", opts: ["A. Cơ cấu xã hội - giai cấp liên quan đến các đảng phái chính trị và nhà nước.", "B. Cơ cấu xã hội - giai cấp liên quan đến quyền sở hữu tư liệu sản xuất.", "C. Cơ cấu xã hội - giai cấp liên quan đến quản lý tổ chức lao động và vấn đề phân phối thu nhập.", "D. Bao gồm tất cả các đáp án trên."], ans: 3 },
      { id: 138, q: "Câu 138. Sự biến đổi của cơ cấu xã hội - giai cấp tất yếu sẽ dẫn đến", opts: ["A. Chỉ ảnh hưởng và tác động đến sự biến đổi của cơ cấu dân cư.", "B. Ảnh hưởng và tác động đến toàn bộ cơ cấu xã hội.", "C. Không ảnh hưởng và không tác động đến sự biến đổi của các cơ cấu xã hội khác.", "D. Chỉ ảnh hưởng và tác động đến sự biến đổi của cơ cấu kinh tế."], ans: 1 },
      { id: 139, q: "Câu 139. Căn cứ cơ bản để xây dựng chính sách phát triển kinh tế, văn hóa, xã hội của mỗi xã hội trong từng giai đoạn lịch sử cụ thể là", opts: ["A. cơ cấu xã hội tri thức.", "B. cơ cấu xã hội tiểu tư sản.", "C. cơ cấu xã hội - giai cấp.", "D. Tất cả các đáp án đều sai."], ans: 2 },
      { id: 140, q: "Câu 140. Trong thời kỳ quá độ lên chủ nghĩa xã hội, cơ cấu xã hội - giai cấp biến đổi gắn liền và bị quy định bởi", opts: ["A. cơ cấu xã hội - giai cấp chủ nô.", "B. cơ cấu xã hội - giai cấp nô lệ.", "C. cơ cấu nền kinh tế tự cung tự cấp.", "D. cơ cấu kinh tế."], ans: 3 },
      { id: 141, q: "Câu 141. Đối với những nước có xuất phát điểm thấp, khi bước vào thời kỳ quá độ lên chủ nghĩa xã hội, cơ cấu kinh tế sẽ biến đổi theo hướng", opts: ["A. tăng tỷ trọng công nghiệp và dịch vụ, giảm tỷ trọng nông nghiệp.", "B. hình thành các vùng, các trung tâm kinh tế lớn.", "C. phát triển lực lượng sản xuất với trình độ công nghệ cao, tiên tiến theo xu hướng ứng dụng những thành quả của cách mạng khoa học và công nghệ.", "D. Bao gồm tất cả các đáp án trên."], ans: 2 },
      { id: 142, q: "Câu 142. Trong thời kỳ quá độ lên chủ nghĩa xã hội, sự biến đổi phức tạp, đa dạng của cơ cấu xã hội - giai cấp đã dẫn đến kết quả gì?", opts: ["A. Xuất hiện các tầng lớp xã hội mới", "B. Sự trở lại các giai cấp đã bị diệt vong", "C. Sự suy thoái của cơ chế kinh tế thị trường", "D. Bao gồm tất cả các đáp án trên."], ans: 0 },
      { id: 143, q: "Câu 143. Trong thời kỳ quá độ lên chủ nghĩa xã hội, sự biến đổi phức tạp, đa dạng của cơ cấu xã hội - giai cấp làm xuất hiện các tầng lớp xã hội mới là do", opts: ["A. kết cấu kinh tế nhiều thành phần.", "B. kết cấu tôn giáo.", "C. kết cấu dân tộc.", "D. kết cấu kinh tế một thành phần."], ans: 0 },
      { id: 144, q: "Câu 144. Quan hệ giữa các giai cấp, tầng lớp trong thời kỳ quá độ lên chủ nghĩa xã hội biến đổi như thế nào?", opts: ["A. Vừa đấu tranh, vừa liên minh, từng bước xóa bỏ bất bình đẳng", "B. Vừa liên minh, vừa tiêu diệt nhau, từng bước giành lợi ích về phe của mình.", "C. Vừa liên minh, vừa tranh giành quyền lãnh đạo Đảng Cộng sản.", "D. Tiêu diệt lẫn nhau vì lợi ích riêng của từng giai cấp."], ans: 0 },
      { id: 145, q: "Câu 145. Xu hướng biến đổi của cơ cấu xã hội - giai cấp trong thời kỳ quá độ lên chủ nghĩa xã hội là", opts: ["A. xóa bỏ dần tình trạng bóc lột giai cấp trong xã hội, vươn tới những giá trị công bằng, bình đẳng.", "B. xóa bỏ dần liên minh giai cấp trong xã hội, vươn tới những giá trị công bằng, bất bình đẳng.", "C. xóa bỏ dần sự lãnh đạo của giai cấp công nhân trong xã hội, vươn tới sự tự do vô chính phủ.", "D. xóa bỏ dần tình trạng bóc lột giai cấp trong xã hội, vươn tới xây dựng xã hội do tầng lớp trí thức và nông dân nắm quyền."], ans: 0 },
      { id: 146, q: "Câu 146. Theo C. Mác và Ph. Ăngghen, các cuộc đấu tranh của giai cấp công nhân ở nhiều quốc gia thất bại chủ yếu là do", opts: ["A. giai cấp công nhân không liên minh với giai cấp tư sản.", "B. giai cấp công nhân không tổ chức liên minh với giai cấp nông dân.", "C. giai cấp công nhân liên minh với giai cấp tư sản và tầng lớp trí thức.", "D. giai cấp công nhân liên minh với giai cấp tư sản và tầng lớp tiểu tư sản."], ans: 1 },

    // Hàm trộn ngẫu nhiên một mảng (Thuật toán Fisher-Yates)
    function shuffleArray(array) {
      const newArr = [...array];
      for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
      }
      return newArr;
    }

    const container = document.getElementById("quiz-container");

    // Hàm render (hiển thị) câu hỏi
    function renderQuiz() {
      container.innerHTML = "";
      
      // Xáo trộn thứ tự các câu hỏi
      const shuffledQuiz = shuffleArray(quizData);

      shuffledQuiz.forEach((item, qIndex) => {
        const qBlock = document.createElement("div");
        qBlock.className = "question-block";

        const title = document.createElement("div");
        title.className = "question-title";
        title.textContent = `Câu ${qIndex + 1}: ` + item.q.replace(/^Câu \d+\. /, ""); 
        qBlock.appendChild(title);

        item.opts.forEach((optText, oIndex) => {
          const optDiv = document.createElement("div");
          optDiv.className = "option";
          optDiv.textContent = optText;
          
          optDiv.addEventListener("click", function() {
            if (oIndex === item.ans) {
              optDiv.classList.add("correct");
              // Loại bỏ class 'incorrect' ở các đáp án khác nếu có
              const siblings = qBlock.querySelectorAll(".option");
              siblings.forEach(sib => sib.classList.remove("incorrect"));
            } else {
              optDiv.classList.add("incorrect");
              setTimeout(() => {
                optDiv.classList.remove("incorrect"); // Cho phép chọn lại
              }, 1000); // Đổi màu đỏ trong 1 giây rồi tắt để tiện chọn lại
            }
          });

          qBlock.appendChild(optDiv);
        });

        container.appendChild(qBlock);
      });
    }

    // Nút làm lại và xáo trộn
    document.getElementById("resetBtn").addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderQuiz();
    });

    // Gọi lần đầu khi mở web
    renderQuiz();
  </script>
