                const buttons = parentDiv.querySelectorAll('button');
                buttons.forEach(b => {
                    b.disabled = true; // Khóa các nút khác sau khi đã chọn đúng
                    if(b.dataset.option !== correctAnswer && !b.classList.contains('incorrect')) {
                       b.style.opacity = '0.5';
                    }
                });
            } else {
                btn.classList.add('incorrect');
                btn.disabled = true; // Không cho click lại vào nút đã sai
            }
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = ''; // Clear loading text

            // Shuffle toàn bộ câu hỏi
            const shuffledQuestions = shuffleArray([...questionsData]);

            shuffledQuestions.forEach((q, index) => {
                const questionCard = document.createElement('div');
                questionCard.className = "bg-white p-6 rounded-xl shadow-sm border border-gray-100";

                const questionTitle = document.createElement('h3');
                questionTitle.className = "text-lg font-semibold text-gray-800 mb-4";
                questionTitle.innerHTML = `<span class="text-blue-600">Câu ${index + 1}:</span> ${q.question}`;
                
                const optionsContainer = document.createElement('div');
                optionsContainer.className = "flex flex-col space-y-3";

                // Không xáo trộn đáp án A, B, C, D để dễ theo dõi
                const optionKeys = ['A', 'B', 'C', 'D'];
                
                optionKeys.forEach(key => {
                    if (q.options[key]) {
                        const btn = document.createElement('button');
                        btn.className = "option-btn w-full text-left p-3 rounded-lg border border-gray-200 hover:bg-gray-50 focus:outline-none";
                        btn.dataset.option = key;
                        btn.innerHTML = `<span class="font-bold mr-2">${key}.</span> ${q.options[key]}`;
                        
                        btn.onclick = () => checkAnswer(btn, q.answer);
                        
                        optionsContainer.appendChild(btn);
                    }
                });

                questionCard.appendChild(questionTitle);
                questionCard.appendChild(optionsContainer);
                container.appendChild(questionCard);
            });
        }

        window.onload = () => {
            renderQuiz();
        };
    </script>
</body>
</html>
